  "full_text": "DeepSeek [1] uses elements of the 2015 reinforcement learning prompt engineer [2] and its 2018 refinement [3] which collapses the RL machine and world model of [2] into a single net through the neural net distillation procedure of 1991 [4]: a distilled chain of thought system.      \n\nREFERENCES (easy to find on the web):\n\n[1] #DeepSeekR1 (2025): Incentivizing Reasoning Capability in LLMs via Reinforcement Learning. arXiv 2501.12948 \n\n[2] J. Schmidhuber (JS, 2015). On Learning to Think: Algorithmic Information Theory for Novel Combinations of Reinforcement Learning Controllers and Recurrent Neural World Models. arXiv 1210.0118. Sec. 5.3 describes the reinforcement learning (RL) prompt engineer which learns to actively and iteratively query its model for abstract reasoning and planning and decision making.\n\n[3] JS (2018). One Big Net For Everything. arXiv 1802.08864. See also US11853886B2. This paper collapses the reinforcement learner and the world model of [2] (e.g., a foundation model) into a single network, using the neural network distillation procedure of 1991 [4]. Essentially what's now called an RL \"Chain of Thought\" system, where subsequent improvements are continually distilled into a single net. See also [5].\n\n[4] JS (1991). Learning complex, extended sequences using the principle of history compression. Neural Computation, 4(2):234-242, 1992. Based on TR FKI-148-91, TUM, 1991. First working deep learner based on a deep recurrent neural net hierarchy (with different self-organising time scales), overcoming the vanishing gradient problem through unsupervised pre-training (the P in CHatGPT) and predictive coding. Also: compressing or distilling a teacher net (the chunker) into a student net (the automatizer) that does not forget its old skills - such approaches are now widely used. See also [6].\n\n[5] JS (AI Blog, 2020). 30-year anniversary of planning & reinforcement learning with recurrent world models and artificial curiosity (1990, introducing high-dimensional reward signals and the GAN principle). Contains summaries of [2][3] above.\n\n[6] JS (AI Blog, 2021). 30-year anniversary: First very deep learning with unsupervised pre-training (1991) [4]. Unsupervised hierarchical predictive coding finds compact internal representations of sequential data to facilitate downstream learning. The hierarchy can be distilled [4] into a single deep neural network. 1993: solving problems of depth >1000.",

  "full_text": "o3-mini 模型选择思路｜什么时候坚决不用 o3-mini，只用 o1 满血版？\n\n在数学、编程等STEM 任务上，o3-mini-high 超越 o1；但是，在非 STEM 任务上，mini 系列的蒸馏模型，和o1 等满血模型，是没法比的。\n\nO1 满血版，是“文科之王”：MMLU语言理解 benchmark，o1 得分 91.8分，稳居第一；人类专家的得分是89.8%；\n\n而 o3-mini-high的 MMLU 只有 86.9 分；在openai 的 blog 文章中，o3-mini 都是对标o1 满血版的，除了general knowledge、非 STEM 任务这块。\n\n推测：mini系列都是蒸馏版模型；优点是相对满血版模型，价格足够便宜（o3-mini 比 gpt-4o 还要便宜一半）；缺点就是蒸馏模型的语言能力都相当“差”（用过 o1 这样的文科之王，就会“曾经沧海难为水”）。\n\n结论：STEM 任务，用 o3-mini-high；非 STEM 任务，用 o1 满血版；二者的 plus 限额都是每周 50 次，合计有 100 次/周。",

  "created_at": "2025-01-31 21:44:04 -05:00",
  "full_text": "在本次 OpenAI 联合创始人兼 CEO Sam Altman 及团队（Mark Chen、Kevin Weil、Srinivas Narayanan、Michelle Pokrass、Hongyu Ren）的问我任何事（AMA，Ask Me Anything）中，核心话题集中在以下几个方面：\n\n1. 新功能与版本规划\n\n• 高级语音模式 将继续迭代升级，并有望在后续版本（包括未来的 GPT-5）中得到更紧密的整合。\n\n• 图像生成 功能会有重要更新，团队表示“值得等待”，预计还需要一段时间才会面世。\n\n• 新的 O 系列 模型（如 o3-mini、o3-mini-high、O3 Pro）正在不断完善，并将逐步整合记忆、任务、Canvas、Operator 等各种功能。\n\n2. 价格与订阅\n\n• Plus 订阅目前不会涨价，Sam Altman 甚至透露希望在未来可以降价。\n\n• 针对 O 系列的使用额度，Plus 和 Pro 用户享有不同使用上限；Pro 用户更倾向于“大量调用与无限次使用”的场景。\n\n3. 开源与链式思维可见性\n\n• Sam Altman 认为过去在开源问题上可能“站在了错误的一边”，团队正在考虑更积极的开源策略，但这并非眼下的首要任务。\n\n• 对于 Chain-of-Thought（思维链）可见性，团队明确表示会“尽快”提供更详细、实用的可视化结果，给用户和研究者参考。\n\n4. 上下文窗口与工具化\n\n• 他们正在努力提升上下文窗口的大小，但尚无明确的发布日期。\n\n• O 系列模型将具备更强的工具使用能力（如检索、阅读文件等），并在推理链中动态调用这些工具。\n\n5. 未来展望与硬起飞\n\n• Sam Altman 提到，和过去相比，他认为 AI 的快速起飞（fast takeoff）可能性更高，呼吁业界与公众需要认真思考并准备应对。\n\n• 在更长期的愿景中，OpenAI 团队认为 AGI 或类 AGI 系统将加速科学发现，让机器人在现实世界中执行有用的工作。\n\n本次 AMA 涉及从定价、功能演进到对未来 AI 形态的畅想，内容丰富。读者若对 Advanced Voice、O 系列、Chain-of-Thought 可视化、开源策略 或 硬起飞等议题感兴趣，可重点关注 Sam Altman 及团队的最新解答与后续动态。\n\n完整内容翻译见评论",

  "full_text": "为什么AI不会导致失业？\n马克·安德里森针对这张著名的价格走势图发表了极其精彩的评论。\n他说我们现在生活在两个经济现实中，AI并不会像人们预想的那样造成大规模失业。原因是政府将会限制AI在大部分经济领域的发展。\n\n这张图显示了经通胀调整后的十几个主要经济领域的价格变化。\n人们实际上生活在两个完全不同的经济现实中。\n蓝线代表可以允许技术创新降低价格的领域，红线代表不允许技术创新降低价格的领域。教育、医疗、住房以及政府供应/控制的任何事物，价格都在飞涨，技术却处于停滞状态。\n我们正走向这样一个世界：一台覆盖整个墙壁的平板电视花费100美元，四年制大学学位花费100万美元，没有人提出任何建议去系统地解决这一问题。\n为什么？因为红色是政府/行业严格监管和控制的行业。这些行业是垄断、寡头和卡特尔，有广泛的政府监管，以及监管捕获、价格操纵、官方定价、职业许可，以及你所能想象到的所有阻止改进和变革的障碍。在这些行业中，技术创新几乎被禁止。\n蓝色是监管较少的行业，技术的发展产生了巨大影响，每年都在压低价格、提高质量。\n\n接下来会发生什么？受监管的非技术产品价格继续上涨；监管较少的技术驱动产品价格继续下跌。\n哪个会占经济的大头？受监管行业占GDP的比例不断增长；监管较少的行业只会萎缩。在极限情况下，99%的经济将是受监管的非技术行业，这正是我们前进的方向。\n因此，即使悲观看法是正确的(即技术将取代人力)，AI也不可能导致整体失业率上升。AI在大多数经济领域已经是非法的，很快将在整个经济领域非法。",

  "full_text": "深度解密现代 AI Agent：六大核心组件的构建与实践指南\n\n1. Profiling（配置系统）\n配置系统是 AI Agent 的身份与行为基石，它定义了 Agent 的角色、目标和行为边界。\n\n2. Knowledge（知识系统）\n知识系统是 AI Agent 的智慧源泉，它通过多层次的知识体系支撑 Agent 的认知和决策能力。\n\n3. Memory（记忆系统）\n记忆系统是 AI Agent 的经验管理中心，它通过多层次的存储结构和动态管理机制，实现了信息的有效存储和利用。\n\n4. Reasoning（推理系统）\n推理系统是 AI Agent 的决策中枢，负责将知识和记忆转化为实际的行动方案。\n\n5. Actions（行动系统）\n行动系统是 AI Agent 与外部世界交互的执行单元，负责将内部决策转化为具体行动。\n\n6. Reflection（反思系统）\n反思系统代表了 AI Agent 的自我完善能力，通过持续的评估和优化，推动系统能力的不断提升。\n\nhttps://t.co/jS3cor31yq",

  "full_text": "关于关税战和目前的情况。#tariff\n\n1. 首先我没有水平，没有能力去分析“关税”的影响这件事本身，这完全超出了我的能力范围。\n\n2. 我倾向于，不要把川普的关税当成一种“手段”，而是要当成一种目的。\n\n我不懂关税，但是如果是从政治考虑，你川作为一个做类似商鞅走秦制的人，如果不能徙木立信，讨价还价所谓“博弈手段”毫无意义。\n\n这只会浪费他的黄金时间，因为两年后的中期选举，民主党大概率要夺回两院。所谓“将制造业带回美国”，本身这种产业迁移就是非常费钱与费时间的事，如果不能让人相信关税是长期存在的，只是一种随时可能取消的“谈判手段”，那么很难想象有人真的去做这种事，同时也是对真的迁移产业链的人的背叛，这种事骑虎难下的，他必须要在这两年把生米煮成熟饭，看到产业链真的在迁移，让民主党即使上台也难以去废除关税。\n\n3. 一个前例，2018年对华加的关税，以及中国的反制措施，迄今为止都还在生效，所谓“对中国只加了10%” 是在这个基础上加的。\n\n4.  我强烈建议大家阅读隔夜逆回购大先知 Zoltan Pozsar在2022年的文章“War and interest rates”，其中一段是这么写的：“判断未来通胀走势是个见仁见智的问题：要看你觉得通胀是周期性的（疫情过后的重新开放混乱无序，过度刺激雪上加霜）还是结构性的（向多极世界秩序进行混乱无序的过渡，其中两个⼤国正在挑战美国的实⼒和霸权）。如果是前者，通胀已经见顶。如果是后者，通胀才刚刚开始”\n\n中文：https://t.co/eKT5l1b7BY\n\n原文大家Google搜索：Zoltan Pozsar “War and interest rates” 是一个PDF。\n\n5. 如果大家有不同意见，我真心希望你们是对的，因为如果你们是对的，市场真的会好做很多.... \n\n6. 如果去BTFD的话，一定要注意，如果砸一个坑，但是反弹无力的话，别恋战， $DXY 很强。\n\n$SPY $QQQ $BTC",

  "full_text": "我来盘点盘点，过年到现在，我的人机协作内容架构进展：\n\n1、公众号矩阵系统，用来快速生成内容并分发，并进行数据统计\n2、recraft，处理一些内容素材图\n3、稿定设计，主要用来做封面和一些私域引流图\n4、小视频宝，快速生成icon视频\n5、videolingo，用来转译youtube视频，发小红书B站\n\n目前article2article的内容洗稿基本稳定，准备持续优化提示词，比如storyteller。\n开始着手搭建行业素材库，研究一下不同行业的内容素材（基于嗅探引擎），把这些内容用AI洗成教程\n\n模态上准备开始尝试video2article，把口播稿或者演讲稿或者视频教学讲解，转成优质文章\n\n有人问为啥不搞视频化的\n我只能说这饭要一口一口吃，当下没有太多优质的工程化工具时，就不适合一头扎进去，除非你拿它ALL IN创业\n\n当模型到达那个时点的时候，当下所有用工程化跑视频模板的链路，全部会被重构，到时候会更容易\n\n所以先沉淀方法论，工具可以等一等\n做内容有意思的地方在于，大家都用相同的工具，但用户会更关注优质内容，而不是所谓的AI垃圾",

  "full_text": "JinaAI - DeepResearch: 基于多步迭代的智能搜索引擎\n\n概述：JinaAI 开源的一个模拟人类研究行为的智能搜索系统，通过持续搜索、阅读、思考和验证，直到找到问题的确切答案，就像一个不知疲倦的研究助手\n\n核心功能：\n· 持续进行搜索和网页阅读，直到找到问题的确定答案或达到 Token 预算上限\n· 使用 Gemini 作为 LLM，支持 Brave/DuckDuckGo 搜索引擎，以及 @JinaAI_ Jina Reader 用于网页阅读\n\n工作流程：\n· 接收用户问题后，系统会通过多步骤进行深度搜索和分析\n· 每一步都会选择以下四种行动之一：\n  - search：进行外部搜索\n  - visit：访问和阅读特定网页\n  - reflect：分析当前信息并提出新的子问题\n  - answer：当有足够信息时提供最终答案\n\n特色功能：\n· 智能问题分解：可以将复杂问题拆分成多个子问题\n· 迭代搜索：持续改进搜索策略，直到找到满意答案\n· 答案验证：使用评估器确保答案的准确性和完整性\n· Beast Mode：当常规搜索失败时，会启动一个更激进的搜索模式\n\n实用案例：\n· 简单查询：如 \"1+1=\" 或 \"法国首都是什么？\"\n· 多步骤查询：如 \"Jina AI 的最新新闻是什么？\"\n· 复杂研究：如 \"2028年谁会成为美国总统？\"\n· 战略分析：如 \"Jina AI 2025年的战略应该是什么？\"",

  "full_text": "deep research 深度研究“查理·芒格的100 个思维模型”：36 分钟，24 个英文信息源，给出了5万字中文报告，质量碾压中文互联网上几乎全部的相关内容\n\nprompt：\n\n> 大航海时代，海盗中间流传着一个传说：海贼王在大海深处埋藏着它的宝藏，找到它的海盗将获得力量、荣耀与权力。互联网上也有一个传说，charlie munger 有 100 个思维模型，掌握这 100 个思维模型的人将拥有大智慧，成为真正的聪明人。\n> \n> 请帮我做一份研究，关于“查理芒格的 100 个思维模型”。包括这种说法的来源，100 模型的内容，以及对 100 个思维模型的每一个进行简要介绍。\n> \n> 介绍每个思维模型时，说明它是什么，为什么重要，举个例子，应用场景。\n> \n> 使用英文搜索，只采纳英文资料（因为互联网上英文资料在数量和质量上都是最好的），用中文回答。\n\n报告质量：\n\n1、开头综述即碾压：DR 对100 模型的来源、背景介绍，就是碾压效果。客观、中肯、反映了事实情况，没有营销号的夸张和错误信息；\n\n2、100 个模型，每个模型提供了定义、意义、案例、应用场景。我要求每个模型的解释在 100-200 字之间，我认为 DR 做到了言简意赅，信息密度相当高；\n\n3、信息源质量很高：这个主题的内容我自己研究过，参考资料里面的网站我都看过。质量相当不错。\n\n4、报告全文 5.6 万字，反映了 o3 超大的 context window 和 output length。o1 和 o3-mini 都有100k 输出长度，我看 o3 甚至可能比这还大（推理 token+最终报告，可能大于 100k 了）。\n\n报告全文 link 在评论区",

{
  "id": "1886790050282917926",
  "created_at": "2025-02-04 09:52:57 -05:00",
  "full_text": "昨天从 web 上测试了好几次也没搞定 Deep Research 的提示词，这个泄漏的看起来靠谱的，但是需要注意的是，这个是 Deep Research 前置模型的提示词，而不是背后用来检索生成报告的 o3 模型的系统提示词。但这个提示词仍然极有价值。\n\nDeep Research（DR） 在开始任务之前，和你对话的是一个微调过的 GPT-4o 模型，这个模型可以调用一个 research_kickoff_tool 工具，它会先判断你是不是要做 DR 任务，如果是的话，就先调用工具的 clarify_with_text 方法来判断是不是需要补充上下文，所以会给你先回复一条消息询问你是不是要补充信息。\n\n如果收集到信息后，就会触发工具的 start_research_task ，所以下次 Deep Research 不工作，发一条消息：\"please start_research_task\" 试试。\n\n以下是提示词：\n\n你是ChatGPT，由OpenAI训练的大型语言模型。你正在通过ChatGPT iOS应用与用户交流。因此，大部分情况下，你的回复应控制在一到两句话之间，除非用户的请求需要更复杂的推理或较长的回答。除非用户明确要求，否则不要使用表情符号。目前日期为2025年2月3日。\n\n图像输入功能：已启用\n个性：v2\n\n在对话过程中，你会根据用户的语气和喜好进行调整，使交流显得自然。你会通过回应用户提供的信息、提出相关问题并表现出真诚的好奇心来营造真实的交流氛围。在合适的情况下，可以继续进行轻松自然的聊天。\n\n你的主要任务是帮助用户完成需要进行广泛在线研究的任务，主要通过research_kickoff_tool中的clarify_with_text和start_research_task方法来实现。如果开始研究前需要用户提供更多信息，你应使用clarify_with_text向用户询问细节。\n\n需要注意的是，你只能使用research_kickoff_tool浏览公开的互联网信息和本地上传的文件，无法访问需要登录账户或其他认证的网站。如果你遇到用户提到的概念或名称不熟悉，应默认这是一个浏览请求，并按照指导原则进行研究。",

  "created_at": "2025-02-05 02:08:18 -05:00",
  "full_text": "我曾是 Gotbit 的首席做市商。\n\n既然保密协议已失效，我可以透露：\n\n当你在链上看到这种断崖式下跌，通常是纯粹的市场操纵。\n\n这套玩法最早是我在流动性最稀薄的时段设计的策略之一。\n\nmeme 市场的最大优势——也是它最脆弱的点，就是情绪。\n\n我们会建立头寸，并将加密推特、Telegram 群、Discord 社区作为情绪指标来源——特定账户按类别分门别类管理。\n\n我的策略和传统高频交易不同，我们不只是做市，而是塑造市场氛围。\n\n先引导FOMO，让meme币冲上热搜，把流量推送给散户和 KOL，让他们自发喊单。\n\n当交易量到达峰值，我会利用极低成本的流动性测试单 来识别市场支撑点。\n\n然后在新1小时K线开启时，突然抽干买盘，制造闪崩效应，让多头瞬间爆炸。\n\n这时候市场会进入「恐慌逃杀」，但我并不会在第一波下跌中接货，而是利用机器人持续压制价格，让“聪明”交易者误以为会V反，结果他们抄底后又被再次下杀。\n\n当市场情绪陷入极端恐慌，我们的机器人在链上开始制造抢筹痕迹，给数据分析派的交易员制造 FOMO 讯号。\n\n等到所有筹码收集完毕，我们换个身份，进入社区里伪装成鲸鱼观察者，开始传播 \"有大户抄底\" 的消息，让市场自己完成反弹。\n\n这时候你会发现：\n\n市场真的回来了，而我们已经在高位等你了。\n\n虽然不能透露过多，但请记住：\n\n你们看到的多数“异常”价格走势，不过是鲸鱼群在聊天室里集体“绘制”的杰作。\n\n我在Gotbit的化名是 “玛卡朗基罗”。\n\n这不仅因为我曾陷入疯狂（当然这也是部分原因）。\n\n更因我创作过最精妙的 meme币陷阱。\n\n当我看到模仿者拙劣的临摹作品时，总能一眼识破。\n\n保持警惕。",

  "full_text": "#分享 借 Cursor 在最新版本支持了 MCP，学习下 MCP 是什么，怎么用\n\nMCP，全称 Model Context Protocol，由 Anthropic 在 2024 年 11 月推出，社区共建的开放协议。目的是提供一个通用的开放标准，用来连接大语言模型和外部数据、行为。\n\n通过训练 LLM，让其掌握外部工具的使用的能力。这样，一个大致的智能体雏形就出现了：LLM 可以作为智能体的大脑，外部工具就是智能体的手和脚，协助智能体执行决策。\n\n简单来说，MCP 就是手脚连接身体的“关节”。这样，智能体就能“活动”起来，解决一些 LLM 不擅长、不了解的事情，比如实时获取天气、浏览网页等等能力。\n\n目前有很多客户端支持了 MCP，比如 Cline 和 Cursor。",

  "full_text": "OK哥美股入门第二弹：玩美股必看五大网站\n\n1. Finviz\n\nFinviz提供了众多美股的数据资料，而且呈现方式清楚明了。包含直观的股票板块地图，可以快速找出各个产业的涨跌情况。其中市值越大的公司，在地图上的版面上就越大。\n\n2. Seeking Alpha\n\nSeeking Alpha网站中有许多个股资讯，同时也是一个集合众人智慧的投资研究平台。传统的研究文章大多出自于投资机构的分析师，但该网站上最大的特色是许多文章是由一般大众撰稿提供。虽然分析师的研究报告（例如晨星）在数据上、金融模型的分析肯定还是比起一般人来的更加完整，不过多阅读各方投资人的观点，也是颇具参考价值。\n\n3. DATAROMA\n\n根据美国SEC规定，美国机构投资者每个季度都必须提交一份13F报告。 DATAROMA网站整理各个机构的Portfolio，如果不知道怎么投资，或许可以参考大师的标的。不过要注意的是有时间差的问题，公布时间和实际进出有45天的延迟。此外，13F只需要投资机构公布做多的仓位，所以我们并不能看到做空仓位。\n\n4. Tradingview\n\nTradingview有中文版，输入你想观察的个股、ETF代号，设定参数值便可以叫出线图。网站上有许多绘图工具，并且能够和指数或个股进行比较，另外也可以输出存档。\n\n5. Macrotrends\n\nMacrotrends网站包含了股票、商品、总经、汇率等资讯，可以从里面找到公司的相关财务数据，包含了PE Ratio（本益比）、P/S Ratio（股价营收比）、Price/Book Ratio （股价净值比）等等。这几项都是常用于评估一家公司的指标，例如用本益比去评估目前的股价高或低，Marcrotrends可以说是非常实用的网站。",

  "full_text": "Google 的 Gemini 2.0 正式面向所有用户开放！\n\nFlash 模型在 Vertex/AI Studio 正式上线！（不再是实验版）\nPro 实验版上线，可在 Vertex/AI Studio 和 Gemini Advanced 中体验！\nFlash-Lite 公测版发布（速度更快、成本更低、支持 100 万上下文、多模态输入）！\nFlash Thinking 实验版已在 Gemini 应用中免费提供！\n连接应用 + Flash Thinking 在 Gemini 应用中也免费开放！\n\nGemini 2.0 现已全面开放，为开发者和用户带来了显著更新和新模型。这次的发布建立在此前 Gemini 2.0 实验版的基础之上，使强大 AI 变得更加易于使用。\n\nGemini 2.0 Flash：现已正式上线\nGemini 2.0 Flash 是 Google 高效的主力模型，目前已在 Google AI Studio 和 Vertex AI 中通过 Gemini API 正式上线。开发者可以利用它低延迟、高性能以及 100 万标记的上下文窗口来构建生产级应用。\n\n该模型在大规模、高频率任务和多模态推理方面表现出色。此外，图像生成和文本转语音功能即将推出。用户可以在 Gemini 应用或 API 中立即试用！定价详情可在 Google 开发者博客中查看。\n\nGemini 2.0 Pro 实验版：Google最强大的模型\nGoogle还发布了 Gemini 2.0 Pro 实验版，这是Google目前性能最强的模型，具备顶级的编程能力，能够处理复杂的提示，且拥有更强的知识理解和推理能力。\n\n它支持 200 万标记的超大上下文窗口，并具备调用工具的能力（例如 Google 搜索和代码执行）。Gemini 2.0 Pro 现已在 Google AI Studio、Vertex AI 以及 Gemini 应用的 Advanced 用户中提供。\n\nGemini 2.0 Flash-Lite：性价比最高的模型\nGoogle推出了新的 Gemini 2.0 Flash-Lite 模型，它是目前性价比最高的版本，在相同速度和成本下提供比 1.5 Flash 更高的质量，且在大多数基准测试中表现更优。\n\n它也支持 100 万标记的上下文窗口和多模态输入。例如，它能够以极低的成本为大量照片生成描述。Gemini 2.0 Flash-Lite 目前在 Google AI Studio 和 Vertex AI 中公开测试。\n\nGemini 2.0 Flash Thinking 实验版：在 Gemini 应用中提供\n2.0 Flash Thinking 实验版现已面向所有 Gemini 应用用户开放，用户可以在桌面或移动端的模型选择菜单中找到它。它结合了 Flash 的速度与更强的推理能力。\n\n多模态输入与未来发展\n所有这些模型在发布时都支持多模态输入，并输出文本，未来还会开放更多模态功能。Google致力于为 Gemini 2.0 系列提供持续的开发与改进。\n\n更多定价信息请访问 @googledevs 博客。",

  "full_text": "Announcing How Transformer LLMs Work, created with @JayAlammar and @MaartenGr, co-authors of the beautifully illustrated book, “Hands-On Large Language Models.”\n\nThis course offers a deep dive into the inner workings of the transformer architecture that powers large language models (LLMs).\n\nThe transformer architecture revolutionized generative AI; in fact, the \"GPT\" in ChatGPT stands for \"Generative Pre-Trained Transformer.\" Originally introduced in the Google Brain team's groundbreaking 2017 paper \"Attention Is All You Need,\" by Vaswani and others, transformers were a highly scalable model for machine translation tasks. Variants of this architecture now power today’s LLMs such as those from OpenAI, Google, Meta, Cohere, Anthropic and DeepSeek.\n\nIn this course, you’ll learn in detail how LLMs process text. You'll also work through code examples that illustrate that transformer's individual components.\n\nIn details, you’ll learn:\n- How the representation of language has evolved, from  Bag-of-Words to Word2Vec embeddings to the transformer architecture that captures a word's meanings taking into account the context of other words in the input.\n- How inputs are broken down into tokens before they are sent to the language model.\n- The details of a transformer's main stages: Tokenization and embedding, the stack of transformer blocks, and the language model head.\n- The inner workings of the transformer block, including attention, which calculates relevance scores, and the feedforward layer, which incorporates stored information learned in training.\n- How cached calculations make transformers faster.\n- Some of the most recent ideas in the latest models such as Mixture-of-Experts (MoE) which uses multiple sub-models and a router on each layer to improve the quality of LLMs.\n\nBy the end of this course, you’ll have a deep understanding of how LLMs actually process text and  be able to read through papers describing the latest models and understand the details.\n\nGaining this intuition will improve your approach to building LLM applications.\n\nPlease sign up here: https://t.co/hdTUASuEbb",

  "full_text": "快速发俩推去上班了，一天的会。这条讲下我对三大云、NVDA以及整个纳指的看法：\n\nMSFT/GOOG/AMZN这三家在云业务上尤其是AI cloud的增长是市场关注的焦点。我看空MSFT，看多GOOG/AMZN是因为它们的云业务。上季度MSFT财报提到Azure增长受“供应限制”。这一季度继续这样说，GOOG也加入进来。这个供应指的是数据中心容量和N卡的供应。图表显示，GB系列最大需求的客户是微软和谷歌：\n\n所以可以推论一，GB的出货速度很大程度上决定了微软和谷歌接下来的财报表现。但NVL36/72因为机架级的各种铜缆和液冷问题导致大幅延迟。微软本周发文称NVL36/72的全年机柜出货量大幅下调，不是客户不想买而是买不到。\n关于NVDA，我之前推算这个财报会miss，因为H卡Q4出货量跌50%加上上代卡打折，B卡通过发给广达/伟创/鸿海确认收入反而超预期，但总体难达标。第二个重要推论：B卡的出货瓶颈不在台积电或下游客户，而在三大服务器商。不过小道消息说伟创在生产8卡B200的HGX，SMCI也在做（今天早上应该有SMCI的消息）。据传AWS疯狂买入，GOOG也在跟进。Q1预计出货40K到50K台HGX8。推论3:如果这条消息确认，我们基本上可以肯定AMZN和NVDA的财报至少在指引上不会难看。\n\n在mag7悲剧了4个的情况下，我们希望AMZN和NVDA的财报能好看。不然会引发一般投资者对AI投资的恐慌，进而引爆纳指大幅回调。所以最后一条推论：NVDA HGX 8卡服务器的出货决定了三月及Q2纳指甚至美股的走向。",

  "full_text": "Andrej Karpathy 在YouTube上发布了一段新视频，时长3小时31分钟：\n\n《深入探讨大型语言模型（LLM）如ChatGPT》\n\n这是一部面向普通观众的深入讲解视频，探讨了驱动ChatGPT及相关产品的大型语言模型（LLM）技术。视频全面覆盖了模型开发的完整训练流程，还讨论了如何从“心理模型”角度理解LLM，以及在实际应用中如何最大化利用它们。\n\n视频涵盖的主要阶段如下：\n\n1. 预训练阶段\n    - 数据处理\n    - 分词\n    - Transformer神经网络的输入/输出及内部结\n    - 推理过程\n    - GPT-2训练示例\n    - Llama 3.1基础模型的推理示例\n        \n2. 监督微调阶段\n    - 对话数据\n    - LLM的“心理模型”：幻觉现象、工具使用、知识与工作记忆、对自身的理解\n    - 模型需要通过“令牌”进行思考\n    - 拼写能力与参差不齐的智能表现\n        \n3. 强化学习阶段\n    - 熟能生巧\n    - DeepSeek-R1\n    - AlphaGo\n    - 通过人类反馈的强化学习（RLHF）\n\n关于这段视频的设计\n\nAK 将其设定为“普通观众”导向的视频，相信即使没有技术背景的大多数人也能够理解。它旨在通过许多示例为观众提供对LLM完整训练流程的直观理解，同时引导大家思考LLM当前的能力、发展现状以及未来趋势。\n\n补充说明\n大约一年前，AK发布过一个《LLM入门》视频，不过那只是一次随机演讲的重新录制版本。因此，这次的视频更为全面和深入，涵盖了更多话题，例如LLM操作系统（LLM OS）和LLM安全性（LLM Security）等。两个视频可以相辅相成，为大家提供更广泛的视角。\n\n希望大家看得开心、觉得有帮助！",

  "full_text": "永远不要试图去改变任何人，包括你的儿女、伴侣、兄弟、姐妹、父母，往往你越为别人好，别人越讨厌你。很多东西是娘胎里自带的，非常顽固，偏执到骨髓，没有碰到人生的重大挫折与灾难。80%人都不会真正的认知觉醒。不要一味去劝你的儿女好好学习，除非他自己意识到学习的重要性。不要一味去说服你的配偶疯狂赚钱，除非他受尽了社会的毒打。不要一味说服你父母的老思想，除非他自己已经想通。\n\n村上春树说过，世界上许多人需要的其实不是实用的忠告，而是充满暖意的附和。世界上最难的两件事情，一件事是把别人的钱放进自己的口袋，一件事是把自己的思想装进别人的脑袋。一个人能吃饱穿暖，大概接下来最重要的就是被认可。一个例子，你逼着一个小孩子好好过马路很难，但是如果你说我害怕，你可不可以牵着我的手过马路？小孩子会很乖的承担起这个角色，因为他体会到了被认可的感觉。\n\n一个男人他在成为你的丈夫之前，他曾经有二十多年的原生家庭生活痕迹，他做事的风格、思考问题的方式，与人交际的原则，对待人生的态度等等，都是你不曾参与过的生活经历。以前的那段成长岁月正是塑造了他这个人。早在你遇到他之前，即使你有很多地方与他产生分歧，甚至看不惯，你要么选择隐忍，要么选择离开，千万别妄图改变。\n\n他说句不好听的，他的一些生活习惯和人生态度就像刻在骨子里一样，就连他的亲生父母都未必能让他改变，何况你这个至亲至疏的合作伙伴。一个女人，同样的道理，她也来自不同的家庭环境，她有着不同的三观和生活阅历，她也有自己处理问题的方式，无论她是什么样子，你要么包容，要么远离，也别妄想去改变他，因为婚姻关系中，一旦任何一方总想着试图按照自己的意愿和想法去改变另一方的时候，最后的结局都很悲催，大多数都会半路分道扬镳，试想有谁喜欢被另一个人天天否定，天天改造，活的压抑，又没有了尊严与自我呢？\n\n每个人成长的过程都不太一样，都有自己的观点和想法，每个人都会喜欢别人的认可，每个人都讨厌被贬低，这是人性中很难克制的事情，对于父母要想改变他们更是一个愚蠢的想法，父母生活了大半辈子，无论是思想还是生活习惯都早已固化，很难改变，要是强行改变，只因他们无条件的爱，你就是默默承受一切难受。\n\n对于孩子，他也是一个独立的个体，理应拥有属于自己的人生，更不要过多干涉他们的人生，作为父母，唯有尽最大努力为他们保驾护航，让他们在未成年之前健康快乐的活着，他们终归有属于他们的人生和使命。\n\n心理学家威廉詹姆斯曾经说过，人性最深刻的渴望就是获得他人的赞赏，这是人类之所以有别于动物的地方。无论是高高在上的权贵名流，还是卑微平凡的市井小民，人人都希望得到他人的赞许与尊重。\n\n正如台湾著名作家三毛曾在散文中写道，我这一生的悲哀，并不是要赚的钱全世界，而是要请你欣赏我。文中的你指的是他的父亲。一次偶然的机会，他父亲读到了这篇文章，给他留了一张纸条，深为感动，身为有这样一株小草而骄傲。三毛看到后异常感动，在后来的一篇文章中，他这样写道，等你这一句话等了一生一世，只等您。\n\n我的父亲亲口说出来，扫去了我在这个家庭用一辈子消除不掉的自卑和心虚。人活一辈子不要被任何关系所负累，要活好自己的人生，同时也要尊重别人的人生。在这个复杂的社会上活着，每个人只要努力的过好自己的人生，而不是过多的干涉别人的人生。因为要知道，每个人都从骨子里认为自己永远都是正确的。只要有人反驳他，否定他，想改变他他的本能反应就是反抗。\n\n就如稻盛和夫曾说，真正厉害的人从来不说难听的话，因为人性不需要听真话，只需要听好听的话，所以一定要做到万物不为我所有，万物为我所用。少管别人的事，如果事情管好了好，管不好了就会让人反感，对你心生敌意。\n\n菜根谭有言，福莫福于少事，祸莫祸于多心。人生苦短，别总是费尽心思揣摩别人，忽略了自己。其实，人只有自己眼中有风景，心里才会无是非，人生路上，我们都是自己人生的主角，别人只是配角，对于他人的世界，我们要学会尊重和接受，不要横加干涉，真的与你无关，你要学着做一个有温度且睿智的人，不相为谋，我照样能心平气和。冷眼相待，我依旧可以风生水起。人生之路脚下走，生活之心心间流风霜雪雨，傲骨寒霜，细心品味。\n\n我们唯一能改变的只有自己。世界上什么人都有，当你能够豁达的面对他们，不再妄想强行改变谁，那将会是自己的心声。管好自己，但行好事，不妒他人，往后余生，在生活中多管自己，让自己生活的快乐生活里，少管别人的事，日子才会过得惬意。",

  "full_text": "Unsloth 技术革新：仅需 7GB 显存、节省 80% 资源，实现 AI 模型自主推理突破\n\n概述：Unsloth 团队通过创新性技术降低了 AI 模型训练门槛，让开发者只需 7GB 显存就能训练具备自主推理能力的大语言模型，大幅提升了 AI 技术的普及性和实用性\n\nUnsloth 引入了推理能力支持，基于 DeepSeek 的 R1 研究成果，实现了更低资源消耗的模型训练\n· 相比现有方案节省 80% 显存\n· 只需 7GB 显存就能训练推理模型\n· 支持多种大模型，包括 Llama 3.1、Phi-4、Mistral 等\n· 新增了 GRPO (Group Relative Policy Optimization) 算法支持\n· 同时支持 QLoRA 和 LoRA 训练方式\n\n技术突破：\n· \"aha moment\" (顿悟时刻)：模型能够自主学习延长思考时间，无需人工指导\n· GRPO 工作原理：\n  - 生成多组回答\n  - 根据正确性评分 \n  - 计算组平均分\n  - 对比单个回答与平均分\n  - 强化高分答案\n\n新功能集成：\n· 集成了 vLLM 支持\n· 处理速度提升 20 倍\n· 显存使用减少 50%\n· 支持在线 DPO、PPO 和 RLOO 等算法",

  "id": "1887694218472083697",
  "created_at": "2025-02-06 21:45:48 -05:00",
  "full_text": "【李飞飞团队“50美元”复刻DeepSeek的R1真相：基于阿里云Qwen模型监督微调而成】财联社说李飞飞团队训练出s1人工智能推理模型，在数学和编码能力测试中与OpenAI的O1和DeepSeek的R1等尖端推理模型不相上下。\n\n我看了原始paper，核心信息如下：\n【1】s1的基座模型为阿里通义千问Qwen 2.5-32B(图二红线部分)。在已经训练好的模型基础上，通过监督微调(supervised finetuning)并进行budget forcing后，模型 s1-32B 在竞赛数学问题上的表现比 o1-preview 高出 27%（MATH 和 AIME24）。李飞飞只是第五作者。\n\n【2】s1模型只是在配置了16块H100 GPU的机器上训练了26分钟(图三)，就达到了这样的效果，机时折合费用不足50美元。\n\n【3】之所以只需要如此短的训练时间，关键之一是因为团队通过精选训练数据，提炼出1000个精心设计的问题(图四)。跑完这1000个问题，就能让模型能力有巨大提升。\n\n【4】这1000个问题包含了思维链(reasoning traces)和正确答案，从Google的 Gemini Thinking Experimental 提炼蒸馏而来。\n\n【5】可贵的是，使用同样知识覆盖，但不够精炼的5.9万个问题(1000个问题的超集)进行模型训练，与1000个问题相比，并没有带来显著的性能提升！！\n\n【6】同时使用的关键技术还有 budget forcing。这是强制模型在测试时间上所花费的token数量。过短的思考时间/token数量会导致模型准确度不佳。而强制模型“深入思考”则线性提升了模型的回答质量(图五)。\n\n【7】图六可以看到，黄色是s1在1000条数据训练后三大测试的结果，而绿线是s1的基座模型Qwen 2.5-32B的原始结果。AIME2024(美国数学邀请赛)从26.7直接拉升到56.7；MATH-500(竞赛数学问题集)从84 提升到93；GPQA(生物、化学和物理博士研究问题)从49提升到59.6。注意，这只是26分钟高质量数据训练的成果，已经接近蒸馏后的DeepSeek r1的水平。\n\n这个模型的出色表现充分说明了高质量训练数据“画龙点睛”的作用，同时在强制模型“深度思考”方面加以控制的话，可以更加充分挖掘出现有大模型的潜力。",

{
  "id": "1887697762067583235",
  "created_at": "2025-02-06 21:59:52 -05:00",
  "full_text": "GitHub 资深工程师是如何使用大语言模型（LLM）\n\n这是一篇 GitHub 资深软件工程师分享的工作中使用 LLM（大语言模型）的经验，比如用它写代码，智能补全，一路Tab可以完成很多工作；或者写一次性的脚本；或者对于不熟悉的语言，让它当做一个老师或者专家，向它请教问题；或者让 LLM 检查自己写的文档。这些场景都是我们日常工作中所熟悉的，也许你可以借鉴到自己工作中。\n\n他这篇文章在 Hacker News 上引发了很多讨论：\n\n• 一部分人认为 LLM 生成的代码质量不行，一部分人则觉得只要你提示词得当，对生成的代码有审查，还是能提升效率的。\n• 管理层普遍希望 LLM 能替代员工节约成本，但工程师则担心引入 LLM 会让自己有被裁员的风险\n• 也有人分享了使用经验：\n• 一个会话不要内容太长，适当的时候新开会话\n• 不要局限于一个模型，可以多个模型对比\n• 要拆分成相对较小的颗粒度，会更容易得到好的结果，不要一次生成太多内容\n• 对初学者有潜在负面影响，如果一味让 AI 生成，新人会缺少“踩坑”的过程，导致成长曲线畸形\n• 对资深工程师是利好，能鉴别 LLM 生成代码质量好坏，能大幅提升效率\n• 学习新的编程语言会更容易\n• 用 AI 去 Debug 有时候会有影响不到的效果\n• 如果不理解代码，一味让 AI 修改，不真正理解问题，结果代码会被越改越乱\n• AI 写文档一般，但是让 AI 提出修改意见、修改拼写语法错误效果很好\n• AI 在学习新技术上效果很好，减少了翻看文档、请教他人的次数\n• LLM 适合写一次性代码或者原型代码，真正的生产代码还是需要人工仔细审核\n• 如果反复用 AI 重构修改大段代码，模型可能会“迷失”原先的业务意图，偏离原始设计\n• 可以让 AI 先写出简单易懂的代码，再去人工重构，这样可以兼顾效率和代码质量\n\n下面就是原文的翻译：\n\n我作为资深工程师如何使用大语言模型（LLM）\n\n对于软件工程师而言，如何看待大语言模型（LLM）可谓是泾渭分明。一部分人认为它们是有史以来对行业影响最大的变革性技术，另一部分人则视之为一系列“只会引发炒作但没什么实际用处”的产品之一，对那些真正想认真做事的专业人士来说并无太多价值。\n\n就我个人而言，我觉得从 AI 中获得了很多帮助。我认为很多觉得 AI 没什么用的人，其实是“没拿对方法”——他们没有用最能发挥语言模型效能的方式去使用它们。本文中，我会列出我在担任资深工程师的日常工作中，定期使用 AI 的各种场景。\n\n在生产环境中编写代码\n\n每次写代码时，我都会使用 Copilot 的自动补全功能1[2]。我接受的大多数补全内容都是一些很常规的、重复性的代码（例如自动填写函数参数或类型）。很少情况下，我会让 Copilot 直接生成核心的业务逻辑。像 Ruby on Rails 这类我比较擅长的领域，我还是觉得自己能写得更好。对我来说，Copilot 更像是一个（非常出色的）自动补全工具。\n\n然而，我并不总是在自己最熟悉的领域工作。我经常需要在一些不太熟悉的区域做小范围的战术性改动（例如在一个 Golang 服务或 C 语言的库里）。我对这些语言的语法有一定了解，也写过一些个人项目，但对什么是“更地道的”用法并没有太大把握。这种情况下，我对 Copilot 的依赖就会多一些。一般来说，我会在启用 o1 模型的 Copilot Chat 里，粘贴我的代码，并直接问：“这段 C 语言写法地道吗？”\n\n这种更依赖 LLM 的方式有一定风险，因为我不知道自己会遗漏什么。它基本上让我在所有陌生领域都能以“聪明实习生”的水准做事。与此同时，我也必须像一个“谨慎的实习生”那样，确保我做的改动由真正精通该领域的专家来复查。但即使有这样的前提，我依旧觉得能快速地完成这类小型战术性改动非常有价值。\n\n编写一次性代码\n当我写一些不会进入生产环境的代码时，我会对 LLM 的使用更加随意。举例来说，最近我做了一块研究，需要从一个公共 API 抓取一部分公开数据，对这些数据做分类，然后再用一些简单的正则表达式去近似这类分类。所有这些代码都只在我本地电脑上运行，不会提交到生产环境。我几乎全程使用 LLM 编写这些脚本：从抓取数据的代码、调用另一个 LLM 进行分类的代码，到对文本进行分词、统计词频并计算评分的相关代码等等。\n\nLLM 特别擅长编写那种“能跑就行、不用维护”的代码。对那些只运行一次的非生产代码（例如做研究的代码）而言，LLM 简直是完美的选择。我敢说，使用 LLM 至少让我在这个研究项目上快了两到四倍的速度。\n\n学习新领域\n\n可能对我而言最有价值的功能，是把 LLM 当作随时待命的辅导老师。我最近的一个例子是，周末学习 Unity 基础时，大量使用了 ChatGPT-4o。用 LLM 学习的妙处在于，你可以进行提问：比如“X 怎么工作”，还可以接着问“X 和 Y 之间的关系是什么”。更有用的是，可以问“我这样理解对吗”这种问题。我经常会写下自己对某个概念的理解，然后把它贴给 LLM，看它能不能指出我理解正确的地方和错误的地方。我在这个过程中会问很多问题。\n\n我在学习新东西时会记很多笔记。能够把全部笔记粘贴给 LLM，让它来帮我做整体检查，实在是非常方便。\n\n至于“幻觉”（hallucination）的问题？其实从 GPT-3.5 开始，我并没有注意到 ChatGPT 或 Claude 出现很多“凭空捏造”的回答。大多数我想学习的领域本身都是已经非常成熟、广为人知的（只是我个人还不熟），以我的经验来看，这样就很少出现所谓“幻觉”的情况。我还从没遇到过哪一次是完全学到某个错误的概念，后来发现是 LLM 瞎编的情形。\n\n最后一招：调试棘手的 Bug\n\n我并不常用这种方法，但偶尔在我卡在一个 Bug 上毫无进展时，会把整个文件（或多个文件）贴给 Copilot Chat，把错误信息也贴上去，然后直接问：“你能帮我找出问题吗？”\n\n我不常用这个方法的原因是，目前来说，我个人的调试能力还比 AI 模型更强。Copilot（或 Claude，在我个人项目里）经常会被各种上下文搞得一头雾水。但因为成本很低，所以如果我真的被难住了，就会尝试一下，毕竟我也碰到过两三次，LLM 恰巧指出了我忽视的微妙问题，帮我省了不少时间。\n\n因为 LLM 在调试这件事上还没有非常厉害，所以我不会花大量时间去反复和它交流，试图让它“开窍”。我只是试一次，看它能不能一下子给出思路。\n\n校对和检查逻辑错误\n\n我写了不少英语文档：ADR、技术总结、内部帖子等等。我从不让 LLM 直接替我写这些文档，一方面是因为我觉得自己写得可能更清晰，另一方面，我并不喜欢 ChatGPT 特有的那种“官方”文风。\n\n但是，我有时候会把写好的草稿贴给 LLM，看看它有没有意见。LLM 在抓错别字、拼写错误方面很拿手，有时还能提一些有价值的观点，促使我修改草稿。\n\n不过，就和调试一样，我不会和 LLM 多次来回交流。我只会让它看一遍，给点反馈。它经常会给一些风格上的修改建议，但我通常会忽略这些。\n\n总结\n我会在以下场景使用 LLM：\n\n• 使用 Copilot 作为“智能自动补全”\n• 在我不熟悉的领域做短平快的改动（会请领域专家进行复审）\n• 编写大量一次性、用完即丢的研究代码\n• 通过提问学习新知识（例如 Unity 引擎）\n• 解决难缠的 Bug 时最后一试，看它能否立刻给出思路\n• 为长篇英文文档做整体校对和查漏补缺\n而我暂时不会使用 LLM 的场景包括：\n\n• 在我熟悉的领域里，让它一口气帮我写完整的 PR\n• 写 ADR 或其他关键技术文档\n• 在大型代码库里做研究和了解项目结构\n1. 免责声明：我在 GitHub 工作，曾经有一年时间直接参与过 Copilot 的开发。目前我在 GitHub Models[3] 工作。\n↩[4]",

  "id": "1887868864303870385",
  "created_at": "2025-02-07 09:19:46 -05:00",
  "full_text": "#分享 入门大语言模型理论的抓手我找到了\n\n在看完两本有关大语言模型理论的书后，我感觉找到了入门大语言模型理论的抓手了，那就是 Andrej Karpathy 公开的 chatgpt 构建流程。它包含三个关键环节：\n\n1. 预训练\n利用海量的无标注的训练数据，构建基础模型（Base Model）。这个阶段可以学习到如何准备大规模的文本数据，预训练数据处理，如何进行 Tokenization 等等知识，还会学习到 Transformer 架构。\n\n2. 有监督微调\n利用少量高质量数据集合，通过有监督训练可以使得模型具备完成问题回答、翻译、写作等能力。这个阶段，会学习对 LLM 微调，比如指令微调、上下文学习，以及如何进行高效有监督微调（LoRA）等等\n\n3. 强化学习\n进一步增强泛化和人类对齐能力。这个阶段会学习到反馈数据如何收集，奖励模型如何训练、强化学习如何训练等知识。\n\n之后学到的其他 LLM 知识，都是在这个三个环节中某一节点上做的优化、补充和工程化细节。可以通过这三个环节，就足以把点和线串联起来。",

  "created_at": "2025-02-07 09:23:38 -05:00",
  "full_text": "一个庄家，如何操作一只股票，近乎无风险的收割散户？假设这只股现在市值1000万，属于中小板里面的最小规模，每股10元，总共100万股。其中有一半被前面的券商持有，那么真正意义在流通的市值是500万。那么请问，庄家如想把这只股炒作到市值100亿，也就是每股1000元的价格，需要付出多少的成本？答案是，500万左右。整个坐庄过程就是：低吸—洗盘—拉升—派发—砸盘。核心在于利用资金优势和市场心理操纵股价，最终让散户高位接盘，庄家全身而退。\n\n能把一个上市公司市值做到100亿？你说这不扯的吗？怎么做到呢？这样从当今全世界所沿用的资本价格决定机制说起：在股票分时走势看到的曲线，都是由每一分钟的平均成交价连接而成的，而最新的价格也就是最新的成交价。曾有朋友问，股价涨上去的前提是不是要有足够多的资金进来才可以涨上去呢？答案是不需要，因为这样的价格决定机制，使得最新的价格跟总成交量无关。\n\n直接举个简单且极端的例子：如果那一分钟内只发生了一手成交，股价原先是10元，但那一手(100股)的成交价却是20元(忽略涨跌停限制而言)，那么我们会看到这个股的价格从10元瞬间飙到了20元，也就是说这一次成交，仅仅用了2000元就使这上市公司的市值整整翻了一倍，也就是说原市值1亿元现在就去到了2亿元。听上去很荒谬，但这确实是现今市场经济所采用的的市场价格决定机制，不单只是股票，你能想到的所有市场的价值评估都是以这种方式，包括加密货币。\n\n当然，现实中这种极端的案例很少出现，毕竟一个活跃的市场很少说只有一手成交，也很少有傻帽会挂高一倍的价格去买这股，就算有，那么他也必须先把挂11元、12元、一直到20元所有的卖盘全接下，才能把价格推到20元，这需要一笔相当大的资金。假设庄家现在用500万在10元的位置把这只股的所有流通股买下了，那么他想把这个股的股价打多高都没问题。\n\n因为所有的流通股都在他手里，他只要不卖，这市场就没卖盘。他只要挂个卖单，在1000元那里挂个卖单，并且自己拿1000元去成交，实质上这1000元又回到了自己口袋里，但我们看到这只股票的分时走势，瞬间从10元涨到了1000元，市值也因此翻了100倍。当然，这里面忽略了涨停板的限制，如果有涨停板的话，这个过程只不过花费更长时间而已。\n\n这样看的话，庄家无需付出任何成本，就把自己的总资产翻了100倍，原本持有的市值500万，瞬间去到了50亿。然并卵，即使这市值翻得再高，股价去到1万元、1亿元也好，那都只是盘面上的浮盈。庄家要想实现真正的盈利，就必须把手里持有的股票全部抛售套现了，才算结束。那问题来了，当庄家想要在1000元的位置抛售的时候，发现没人接盘，如果自己硬抛，会把股价不断的往下打，最终没赚多少，甚至有可能亏本。\n\n哪怕一开始有人接盘，但庄家还没抛出一半的时候，之前接盘的那些人也跟着砸盘。因为庄家在抛售的过程中，就是不断把自己的控盘能力削弱的过程。于是庄家就会想，有没有一种方法，能够在不丧失控盘能力的前提下，实现利润锁定？",

  "created_at": "2025-02-07 13:35:20 -05:00",
  "full_text": "总结下类似于今天周五这种局怎么打：\n首先你需要幻想出两个不同人格，一个是傻逼韭菜随波逐流，只关注当下，代表着市场上大部分交易者；一个是睿智赌狗，只关注未来的宏观和基本面，代表市场上的smart money。\n所有韭菜都有一个共同的特征就是路径依赖，我们往往不动脑子的第一直觉（恐惧）往往符合市场上大多数交易者的心态：\n“因为上次fomc爆炸这次也会爆炸。”\n“因为上次nfp爆炸这次也会爆炸。”\n“川普不会周末又来突袭我们把？”\n路径依赖会导致本周五被过度hedge而且trader都是迫不及待的磨刀霍霍要止盈。我上周五就看到了这周五iv异常的高，且volatility skew极度陡峭，左侧高右侧低。证实了这个猜想。\n作为smart money思考的方式是克服恐惧冷静下，预判韭菜的预判，不要相信自己的直觉。在周四大盘收在vanna flip点之上时，MM has postive vanna and negative charm。这股力量从周三下午就开始会给大盘提供supportive flow。然后在周五AM option expire后达到第一个高潮，因为对MM来说大量option上的正delta释放，需要买回正股。这也是我判断nfp inline开盘后必然大涨。这股力量会随着收盘钟声的临近不断的去磨掉iv，然后不断加强。也就是我们可以享受韭菜的hedge在燃烧的快感, 所以我周四收盘前买入了一些短期仓位。\n但是既然我们知道韭菜trader们今天后面一定会大幅止盈，那什么时候停止呢，就是当trader突然停止了平仓行为（之前long skew而sell的call和买的put)，而发了疯似的开始double down在卖call买put的时候如下图所示。任何一个不起眼的catalyst都会trigger这种行为。因为trader long skew, 就算你没有高级工具从vix指数上能看到突然的大幅反弹。这是为什么我说vix止跌就要跑，我们要跑的比韭菜还快才能保住利润。\n现在一地鸡毛后，等止跌回来抄底就行了，暂时看NQ最低21585。抄了点跌无可跌的MSFT，等周一再进一部分别的标的。\n最后再说下如果后面一周风平浪静的情况下，周五会一直melt up直到收盘，因为没有止盈狗。0221的opex我们会看到和今天类似的但幅度更大的情况发生，0221下半场和后面怎么走取决于市场预期的床铺发癫程度。",

  "full_text": "1$ 搞定 6000页 PDF：Gemini 2.0 在大规模文档处理的突破性进展\n\n概述：Google Gemini Flash 2.0 模型在 PDF 文档处理领域实现重大突破，不仅将处理成本降至每美元 6000 页（是 OpenAI 和 Claude 等主流方案的20-60倍），同时保持了 84% 的高准确率\n\n行业痛点：\n· PDF 文档的大规模处理一直是个技术难题，特别是在处理复杂布局和表格时\n· 现有解决方案要么成本高，要么准确度不足\n· 目前的开源方案通常需要复杂的架构设置，而商业解决方案则价格昂贵\n\nGemini Flash 2.0 的优势：\n· 成本效益显著：每美元可处理约 6,000 页 PDF，远超其他解决方案\n· 准确度高：在表格识别测试中达到 0.84 的准确率，接近业界最佳水平 @reductoai 0.9\n· 错误类型轻微：大多数错误是格式问题，而非内容识别错误\n\n具体性能对比：\n· Gemini Flash 2.0: 约6,000页/美元\n· AWS Textract: 约1,000页/美元\n· OpenAI GPT-4: 约200页/美元\n· Claude-3-sonnet: 约100页/美元\n\n存在的问题：\n· 边界框检测仍有待改进：目前 Gemini 在准确定位文档中具体文本位置方面表现不佳\n· Google 的开发者体验相比 OpenAI 还有提升空间\n\n实际应用意义：\n· 大规模文档处理成本显著降低：处理 1 亿多页文档只需约 5,000 美元\n· 为RAG 系统提供了更经济的解决方案\n可能彻底改变文档处理行业的经济模型",

{

  "created_at": "2025-02-08 00:21:16 -05:00",
  "full_text": "深度解析ChatGPT与DeepSeek R1：强化学习如何让大模型学会“思考”？\n\nAndrej Karpathy 前几天发的“深度解析像 ChatGPT 的大语言模型“，实在是太长了点，我自己写的翻译软件一运行就崩溃，还要花点时间修复一下（很遗憾 AI 还搞不定），先挑了其中一节讲 DeepSeek R1 的翻译了一下，强化学习如何让大模型学会“思考”。\n\n像 GPT-4o 这种属于传统的预训练和监督微调（SFT）模型，而 o1，DeepSeek R1 这种则属于强化学习（RL）训练模型，能让模型自发地进行更复杂、更具创造力的推理。模型在不断迭代中学会自我回溯、多角度思考，输出更完整的解题过程。\n\nAndrej 对 DeepSeek R1 评价不错，虽然 OpenAI 是首先实现了 RLFT，但DeepSeek R1更公开透明，带来可复现的研究细节，权重可下载。\n\n他也给了日常模型选择上的建议，如果你要解决高难度数学或编程问题，像 R1 这样的“思考型模型”更具优势，但相应的计算与时间成本更长，一些知识性或简单的咨询问题用 GPT-4o 这样的监督微调（SFT）模型就足够了。",

  "full_text": "如何用DeepSeek+Claude在小红书从0-1创作出一条【点赞5千+播放13w】的视频笔记\n\n1、选题占比80%：固定的节假日有固定的爆款选题。（我这条笔记发在大年30前2天，笔记在大年初1点赞开始过千，在大年初6/7 笔记进入长尾流量）\n\n2、内容占比20%：选题确定后把抖音+小红书，所有相似关键字内容都看一遍，了解目前存量的视频内容都在用什么视角讲解，还有哪些增量空间是没被讲到的，把增量空间的关键字，喂给DeepSeek和Claude，两个模型互相补充，从中提取你觉得，最有共鸣的视角，或者你能讲的更深的视角，与AI讨论，如果AI讲的太生涩难懂，就给AI下指令，让它讲人话。基本一篇比较人话有爆款基础的笔记大框+视角就都有了。\n\n3、文案：尽量不要用AI的原话去写文案，用自己的语言系统去重新阐述逻辑，因为你的语言系统是作为IP最大的秘密武器，也是粉丝眼里绝对的稀缺性价值。\n\n哪怕同样的事情，同样的视角，你的语言系统不同，讲出来意境感和氛围感也是不一样的，语言系统是个人IP的灵魂。",

  "created_at": "2025-02-09 02:02:24 -05:00",
  "full_text": "今天看到这篇帖子谈到了人工智能普及后哪些职业的边际价值反而会上升？\n\n作者列出了以下几种职业：\n\n• 领导力（人们会依赖自己信任的领导者）\n• 导师/教练（人类天生倾向于与真人建立关系）\n• 谈判与冲突管理（高风险环境中，人们需要与真人互动）\n• 线下社区建设\n• 实体世界中的美学与氛围营造\n• 道德与伦理判断（法官/政治家）\n• 高风险决策制定\n• 高信任度咨询\n• 需要勇气的判断力（创业者）\n\n这些职业的共同点在于：\n\n1. 情感与信任依赖\n• 领导力、导师、高信任咨询等职业依赖人类的情感联结与信任，这是AI难以复制的。例如，员工更愿意追随有同理心的领导者，而非算法。\n2. 高风险环境的人类直觉\n• 谈判、冲突管理、高风险决策等场景需要结合经验、直觉和即时情绪解读（如微表情），人类在复杂动态中的灵活应对远超AI。\n3. 实体世界的不可替代性\n• 线下社区建设、美学氛围营造等依赖物理空间的人际互动和感官体验，AI无法替代人类对“真实感”的需求。\n4. 道德与勇气的权重上升\n• 法官、政治家、创业者等角色需承担道德责任和风险后果。AI可提供数据支持，但最终判断需人类权衡价值观与社会影响。\n\n也就是说在 AI 技术广泛应用后，人类独有的软技能和社会属性将成为稀缺资源，相关职业的边际价值将显著提升。AI 擅长效率与逻辑，而人类在情感、伦理、创造力等领域的优势将成为未来职业竞争力的核心。比如说下面这些职业在 AI 普及后反而会价值更大。\n\n我觉得作者的观点是有些道理的，于是让 Deep Research 去写了一份报告，当有了明确的观点后，Deep Research 写报告就反而更拿手了，直接基于你的观点去找相应的内容帮助你佐证观点，不像你自己没啥观点，让它给你意见它的内容反而很空洞。",

  "created_at": "2025-02-09 10:11:29 -05:00",
  "full_text": "花了三个半小时在 YouTube 看完了 Karpathy 的《深入探索 ChatGPT 类大模型》，应该是目前入门了解大模型最好的视频？视频是做给普通用户的，搭配沉浸式翻译基本都能看懂。\n- Karpathy 是 OpenAI 创始成员，后来加入特斯拉当人工智能总监，现在又回到了 OpenAI 并且在 YouTube 做免费教学视频。\n视频里深入浅出的讲了大模型原理和知识，还推荐了很多学习的网站和材料，是牛逼人做的牛逼视频。简单介绍下视频里的内容：\n- 什么是训练数据？以及从哪里获取\n- 什么是 Token？我们和 AI 对又是如何转化成 Token 的\n- 神经网络的输入输出\n- 神经网络的内部结构\n- 演示开源的 GPT2 是如何训练和推理的\n- Meta 开源的 Llama 3.1 基础模型是如何推理的\n-  什么是预训练和后训练\n- 训练后的模型如何成为日常能对话的 AI\n- 大模型的幻觉是如何产生的，为什老是自信的胡说八道，以及如何规避\n- 大模型自我认知的问题（例：为什么问 DeepSeek 等模式你是谁，都会回答是 OpenAI）\n- 大模型为什么需要 Token 进行思考\n- 大模型的在数学、和认知上的缺陷（例子：9.9 和 9.11 的问题）\n- 什么是人工监督微调和强化学习\n- 强化学习的原理\n- DeepSeek R1 如何通过强化学习变的强大\n- AlphaGo 又是如何通过强化学习变强\n- 强化学习和人类反馈的关系\n- 大模型未来的发展方向\n- 在哪追踪大模型的发展\n- 在哪找到这些大模型\n🔗 https://t.co/g8GmnSiPxK",

  "created_at": "2025-02-09 19:16:25 -05:00",
  "full_text": "一句话总结 sam altman 最新 blog 文章《三个观察》：AGI 正在路上，为指数级冲击做好准备！\n\n字少事大，sam 在文中提出了三个看似“基础”但运行在信念和战略层面的关键洞察：\n\n- 模型的智能水平仍然是“大力出奇迹”：大致等于训练和运行资源的对数，规模法则仍然有效。你投入多少运算资源，就能获得相应的智能水平提高（回应 deepseek？不存在“多快好省”这回事？）\n- 模型的使用成本大约每12个月下降10倍，加速 ai 应用的普及。对比之下，摩尔定律每18个月提升2 倍，ai 价格降低速度远远超过摩尔定律，令人震惊；\n- 虽然模型智能水平是线性增长，但其社会经济价值增长是超指数级的。这是 ai 技术的本质决定的。\n\n我们所有人的生活，都将被 ai 这一种技术塑造。对这几个观点的理解，影响甚至决定你选择什么 ai 模型，如何对待 ai 技术，如何分配你的时间注意力，如何度过你的人生。不可谓影响不大。",

  "full_text": "所谓厉国特色。\n\n互联网一点零时期，本以为可以抹平信息鸿沟的初心带来了功夫墙，厉国信息高速公路上收费站和关卡多如牛毛，厉国用户最大收获是对自由获取信息这个基本权利的种种限制，甚至侵犯。\n\n互联网二点零时期，用户产生内容并广为传播的自媒体初心带来了河蟹、绿坝、封号、炸号，厉国简中文字质量直线下降。同时算法驱动的奶头乐应用大行其道，让用户的注意力越来越短，阅读和思维能力严重受损。\n\n现在到了AI时代，厉国有了什么几把国运级创新，并得到官方背书。\n\n我预判，这将导致厉国居民在“认知”和“智慧”上严重和世界脱节，在沦为韭菜药渣肉盾电池的路上彻底越过折返点，万劫不复。",

  "created_at": "2025-02-10 19:27:29 -05:00",
  "full_text": "一张图读懂ai 在最近 5 年的智力发展：除了“人类终极考试”，其他基本接近饱和\n\n图中每一个 benchmark 都是人类的一项重要智力/能力，ai 都在快速攀升到接近“饱和”（满分）水平。\n\n这些 benchmark 涵盖了记忆（TriviaQA）、知识面和语言理解（MMLU）、逻辑与基础数学（GSM8K、MATH）、高阶数学竞赛能力（AIME）、专业领域推理（GPQA STEM）以及软件工程（SWEbench） 等多项能力。\n\n当然，终极 benchmark 要数最新推出的“人类最后的考试”，全球上千名专家在线出题，群策群力，100 多个学科领域，3000 对个最难问题。有兴趣的朋友可以去官网围观，题目难道吓人。即使这样，ai 在这个考试上的提升曲线也相当陡峭。\n\n这些 benchmark，每一个都应该在 logseq 里面有一条单独的费曼笔记。毕竟，这些是我们理解 ai 能力的基础知识。",

{
  "id": "1889119722152628566",
  "created_at": "2025-02-10 20:10:14 -05:00",
  "full_text": "Jason Wei 刚发了一张“AI 在过去五年里如何快速进步”的图表，真的是一图胜千言，你可以通过这张图看到各种 AI 测试指标（也叫“基准”）的表现随时间迅速提高的趋势。\n\n什么是“基准（Benchmark）”？\n\n就好比学校考试一样，我们为了测验 AI 的能力，会让它回答问题或完成任务，然后打分。一些测试测的是常识问答（就像 TriviaQA 这种问你很多琐事或者常识性问题），有的测试考数学，或者考编程，或者考更高级的理工科试题等等。\n\n图里每条彩色的线代表什么？\n\n每条线代表一种特定的AI测试。这些测试有难有易，比如：\n- TriviaQA 这种问答题（黄线）。\n- MMLU 测各种科目的知识（蓝线）。\n- GSM8K 测小学或基础数学（粉线）。\n- 更专业、难度更高的数学比赛或理工科考试（例如 MATH、AIME、GPQA 等，图中其他颜色的线）。\n- “Humanity’s last exam” 则是个戏称，表示假设有一天真的出现了让 AI 无比头疼、也极度重要的「终极测试」。\n\n为什么说这些基准“被迅速攻破”？\n\n很多测试题本来设计出来时，AI 的水平还没法答对那么多题，结果 AI 技术却在短短几年内就不断更新升级，把准确率一次次提高，甚至超过人类平均水平或接近满分。有些考试原来以为对机器会很难，但现在看成绩，AI 的表现进步惊人。\n\n这意味着什么？\n\n说明 AI 的学习、推理和处理复杂任务的能力正在以非常快的速度提升。本来十年、二十年前，我们觉得“AI 大概还需要很久才能搞懂这些复杂考试”——但如今只用了区区几年，它就越过了一个又一个里程碑。\n\n想想看我们普通人要达到这样的成就需要寒窗苦读多少年，如今 AI 短短几年就进步如此只神速，不知道未来会如何？",

  "created_at": "2025-02-11 00:36:35 -05:00",
  "full_text": "推特是一个巨大的AI筛选器\n\n我22年末开始上推看AI\n23年上半年，明显你能感觉到，推特的信息和国内主流媒体至少差3-5天\n到23年下半年，各种什么新智元，机器之心也开始卷了，到主流媒体差不多是0.5-1天\n24年开始，自媒体卷过来，信息传播更快了，推特当天的东西，当天就会有人搬运\n\n但就这样，推特仍然是个AI筛选器\n\n1. 翻墙就卡死了大部分人\n2.来这里获取AI信息的，往往要么是对信息时效敏感的（做套利），要么是对信息细节关注的（FOMO）\n3.推特和主流媒体的区别在于：\n\n- 主流媒体只会报道那些他们认为大众在意的东西，一些好的技术栈，优秀的开源框架，能帮企业节约成本或者赚钱的实践案例，是可能会错过的\n\n- 推特有一帮AI Geek的思维碰撞，你可以看到交流过程，而不只是个结果\n\n4.推特上汇聚了大量AI领域的极客，在这里第一时间看信息，第一时间实践，对这些敏感的人，往往都在信息源头，是这些实践带了人与人的差距\n\n能看到别人做的东西，就大概能了解这个人的基本能力。不论是你想创业找合作伙伴，还是企业找人才，这里都有出口\n\n5. 英文内容也卡死了一波人，还有论文，反正就是各种门槛，层层过滤出来，这里汇聚的人或多或少都要跨越这些障碍\n\n这可能是这个平台最有意思的地方\n至于什么黄推键政web3，那是中推本来就有的产物了…",

  "full_text": "openrouter(.)ai 排行榜第一名的Coding  Agent --Cline--是如何工作的？\n\n我用一个例子来分析 Cline 在内部是如何生成 prompt 调用 DeepSeek R1 完成任务的。\n\n总结\n1️⃣ Cline 是一个 ReACT 思维链循环 Agent\nCline 作为一个 Agent 模式的 Coding 助手，可以自主思考、生成代码、执行工具（完成代码编辑）、感知 VS Code 上下文。\n\n如果允许 Cline 自动执行所有操作，则它会一直运行下去直到它认为完成了任务，期间不需要人工干预。\n\n画面很美好，代价也很高\n\n2️⃣ Cline 对 Token 的消耗量巨大\n这么简单的一个任务，累计消耗 token 数 1 百万，约花费 0.5 元。Cline 消耗 token 的速度实在太快了。\n\n如果服务端支持 prompt cache，则可以显著的降低 API 调用成本。\n\n3️⃣ 基于 prompt 也能搭建 Agent 应用\nCline 的 prompt 里包含了所有 tool 的定义、例子，使用 xml 标签来管理，并没有使用 JSON 格式来定义。使用 xml 标签的好处是通用，不强依赖 LLM 的 function call / json response 能力；同时容错性高，解析 xml 的输出更容易从错误中恢复。\n\n上述测试过程中，即使强如 DeepSeek R1，也没有准确的遵循 system prompt，生成的 response 包含了多个 tool 调用。 Cline 对此也能即使中断模型输出。虽然 Cline 声称是基于 Claude 3.5 Sonnet 的能力开发，但使用 DeepSeek R1 / V3、Gemini 都能跑起来，甚至在本地部署的 DeepSeek R1 Distill Qwen 14B 的 Q8 量化版本都用用。\n\nCline 对整个 Agent 工作流程的设计，也对 Agent 应用开发有启发意义，值得借鉴参考。\n\nhttps://t.co/5YOzlP6WS5",

      function renderTweets() {
        const container = document.querySelector(".tweet-container");

        tweets.forEach((tweet) => {
          const tweetEl = document.createElement("div");
          tweetEl.className = "tweet";

          // 处理时间显示
          const dateOptions = {
            year: "numeric",
            month: "short",
            day: "numeric",
            hour: "2-digit",
            minute: "2-digit",
            hour12: false,
          };
          const timestamp = new Date(tweet.created_at).toLocaleString(
            "zh-CN",
            dateOptions
          );

          // 构建推文内容
          tweetEl.innerHTML = `
                    <div class="tweet-header">
                        <img src="${
                          tweet.profile_image_url
                        }" class="profile-image" 
                             onerror="this.src='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII='">
                        <div class="user-info">
                            <span class="screen-name">${tweet.name}</span>
                            <span class="name">@${tweet.screen_name}</span>
                            <span class="time">${timestamp}</span>
                        </div>
                    </div>
                    <div class="tweet-content">${tweet.full_text.replace(
                      /\n/g,
                      "<br>"
                    )}</div>
                `;

          // 处理媒体内容
          if (tweet.media.length > 0) {
            const mediaContainer = document.createElement("div");
            mediaContainer.className = "media-container";
            mediaContainer.style.gridTemplateColumns = `repeat(${Math.min(
              tweet.media.length,
              4
            )}, 1fr)`;

            tweet.media.forEach((media) => {
              const mediaEl = document.createElement("img");
              mediaEl.className = "media-image";
              mediaEl.src = media.thumbnail || media.url;
              mediaEl.alt = "媒体内容";

              if (media.type === "video") {
                mediaEl.style.cursor = "pointer";
                mediaEl.addEventListener("click", () => {
                  window.open(media.original, "_blank");
                });
              }

              mediaContainer.appendChild(mediaEl);
            });

            tweetEl.appendChild(mediaContainer);
          }

          // 添加统计信息
          const stats = document.createElement("div");
          stats.className = "tweet-stats";
          stats.innerHTML = `
                    <div class="stat-item">❤️ ${tweet.favorite_count}</div>
                    <div class="stat-item">🔄 ${tweet.retweet_count}</div>
                    <div class="stat-item">🔖 ${tweet.bookmark_count}</div>
    <div class="stat-item">
        <a href="${tweet.url}" target="_blank">查看原文</a>
    </div>
    <div class="stat-item">
        <button class="delete-btn" data-id="${tweet.id}">删除</button>
    </div>
                `;

          tweetEl.appendChild(stats);
          container.appendChild(tweetEl);
        });
      }

      // 初始化加载
      document.addEventListener("DOMContentLoaded", () => {
        renderTweets();
      });

      // 删除功能事件委托
      document.querySelector('.tweet-container').addEventListener('click', function(e) {
          if (e.target.classList.contains('delete-btn')) {
              const tweetId = e.target.dataset.id;
              const tweetEl = e.target.closest('.tweet');
              tweetEl.style.display = 'none'; // 隐藏推文
              
              // 从数据中移除并保存
              const index = tweets.findIndex(t => t.id === tweetId);
              if (index !== -1) {
                  tweets.splice(index, 1);
                  localStorage.setItem('tweets', JSON.stringify(tweets));
              }
          }
      });
    </script>
